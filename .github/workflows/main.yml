name: Java CI/CD Pipeline

on:
  push:
    branches: [ 5-university-library-management ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build All Services
      run: |
        # Forzamos a Maven a usar Java 11 ignorando cualquier otra configuración
        export JAVA_HOME=$JAVA_HOME_11_X64
        mvn clean package -DskipTests -Dmaven.compiler.source=11 -Dmaven.compiler.target=11 -f inventory-service/pom.xml
        mvn clean package -DskipTests -Dmaven.compiler.source=11 -Dmaven.compiler.target=11 -f loan-service/pom.xml
        mvn clean package -DskipTests -Dmaven.compiler.source=11 -Dmaven.compiler.target=11 -f notification-service/pom.xml

    - name: Build Docker Images
      run: |
        docker compose build --no-cache