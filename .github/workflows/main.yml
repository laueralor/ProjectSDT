name: Java CI/CD Pipeline

on:
  push:
    branches: [ 5-university-library-management ] # Se activa al subir a esta rama
  pull_request:
    branches: [ 5-university-library-management ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests 

    - name: Build Docker Images
      run: |
        docker-compose build 