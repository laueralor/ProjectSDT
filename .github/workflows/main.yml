name: Java CI/CD Pipeline

on:
  push:
    branches: [ 5-university-library-management ]
  pull_request:
    branches: [ 5-university-library-management ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build All Services
      run: |
        mvn clean package -DskipTests -Dmaven.compiler.release=11 -f inventory-service/pom.xml
        mvn clean package -DskipTests -Dmaven.compiler.release=11 -f loan-service/pom.xml
        mvn clean package -DskipTests -Dmaven.compiler.release=11 -f notification-service/pom.xml

    - name: Build Docker Images
      run: |
        docker-compose build