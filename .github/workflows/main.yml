name: Java CI/CD Pipeline

on:
  push:
    branches: [ 5-university-library-management ]
  pull_request:
    branches: [ 5-university-library-management ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build All Services
      run: |
        for service in inventory-service loan-service notification-service; do
          echo "Building $service..."
          cd $service
          mvn clean package -DskipTests
          cd ..
        done

    - name: Build Docker Images
      run: |
        docker-compose build